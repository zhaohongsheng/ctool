<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>万能工具箱 · CTool</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="工具箱导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 7V5.8A1.8 1.8 0 0 1 9.8 4h4.4A1.8 1.8 0 0 1 16 5.8V7"></path>
            <rect x="3" y="7" width="18" height="12.5" rx="2.4"></rect>
            <path d="M3 12.2h18M10 12.2v2.2h4v-2.2"></path>
            <path d="M8.6 10.4h.01M15.4 10.4h.01"></path>
          </svg>
        </div>
        <div class="brand-text">
          <strong>万能工具箱</strong>
          <small>CTOOL TOOLKIT</small>
        </div>
      </div>

      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m16 16 4 4"></path>
        </svg>
        <input id="search-input" type="search" placeholder="搜索工具…" autocomplete="off" aria-label="搜索工具">
        <kbd>/</kbd>
      </div>

      <nav class="tool-nav" id="tool-nav" aria-label="全部工具"></nav>

      <div class="sidebar-footer">
        <div class="privacy-line"><span class="dot"></span>所有数据仅在本地处理</div>
        <div class="sidebar-version" id="sidebar-version">CTOOL v1.3.0 · OFFLINE</div>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <main class="main" id="main">
      <div class="compact-nav-wrap compact-only" id="compact-nav-wrap">
        <div class="compact-nav" id="compact-nav"></div>
      </div>

      <header class="topbar">
        <button class="icon-btn mobile-menu" id="sidebar-toggle" type="button" title="打开导航" aria-label="打开导航">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>

        <div class="compact-picker compact-only" id="compact-picker" hidden>
          <span class="compact-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M8 7V5.8A1.8 1.8 0 0 1 9.8 4h4.4A1.8 1.8 0 0 1 16 5.8V7"></path>
              <rect x="3" y="7" width="18" height="12.5" rx="2.4"></rect>
              <path d="M3 12.2h18M10 12.2v2.2h4v-2.2"></path>
              <path d="M8.6 10.4h.01M15.4 10.4h.01"></path>
            </svg>
          </span>
          <select class="select" id="compact-tool-select" aria-label="选择工具"></select>
        </div>

        <div class="title-wrap">
          <button class="icon-btn back-to-workspace" id="back-to-workspace" type="button" title="返回工作台" aria-label="返回工作台" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 18l-6-6 6-6M8 12h12"></path>
            </svg>
            <span class="back-label">返回工作台</span>
          </button>
          <div class="tool-eyebrow" id="tool-category">本地工具</div>
          <h1 id="tool-title">万能工具箱</h1>
          <p id="tool-desc">选择一个工具开始使用，所有内容都在浏览器本地处理。</p>
        </div>

        <div class="top-actions">
          <select class="select locale-select" id="locale-select" aria-label="语言" title="语言"></select>
          <span class="local-badge"><span class="dot"></span>本地运行</span>
          <button class="icon-btn compact-only" id="compact-expand" type="button" title="在完整工具箱中打开" aria-label="在完整工具箱中打开">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 4h6v6M20 4l-8 8"></path>
              <path d="M19 14v4.2A1.8 1.8 0 0 1 17.2 20H5.8A1.8 1.8 0 0 1 4 18.2V6.8A1.8 1.8 0 0 1 5.8 5H10"></path>
            </svg>
          </button>
          <button class="icon-btn compact-only" id="compact-close" type="button" title="关闭小窗" aria-label="关闭小窗">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18"></path>
            </svg>
          </button>
          <button class="icon-btn" id="theme-toggle" type="button" title="切换主题" aria-label="切换主题">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2"></circle>
              <path d="M12 2.8v2M12 19.2v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M2.8 12h2M19.2 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"></path>
            </svg>
          </button>
        </div>
      </header>

      <div class="tool-content" id="tool-content"></div>

      <footer class="main-footer">
        所有数据仅在浏览器本地处理，不上传服务器 · CTool 万能工具箱
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/vendor-qrcode.js"></script>
  <script src="js/tools-data.js"></script>
  <script src="js/tools-text.js"></script>
  <script src="js/tools-dev.js"></script>
  <script src="js/tools-generators.js"></script>
  <script src="js/tools-convert.js"></script>
  <script src="js/tools-extra.js"></script>
  <script src="js/tools-more.js"></script>
  <script src="js/tools-download.js"></script>
  <script src="js/tools-workspace.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
